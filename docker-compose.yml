# Optional scale-out stack: web + Celery worker + beat + Postgres + Redis.
# This is the multi-process path (RUN_VIA_CELERY=true) for when one web service
# isn't enough — the default Render deploy needs none of this.
# Copy .env.example to .env.docker and fill the secrets before `up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autojob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autojob}
      POSTGRES_DB: autojob
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autojob"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: python manage.py init-db
    environment:
      APP_ENV: production
      FLASK_APP: autojob.wsgi:app
      DATABASE_URL: postgresql+psycopg2://autojob:${POSTGRES_PASSWORD:-autojob}@db:5432/autojob
      SECRET_KEY: ${SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    # Multi-worker web tier. Safe here (unlike the single-service default)
    # because RUN_VIA_CELERY=true sends runs to the worker and progress streams
    # over Redis pub/sub, so it survives crossing process boundaries.
    command: gunicorn autojob.wsgi:app --bind 0.0.0.0:9000 --workers 4 --timeout 120 --access-logfile -
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://autojob:${POSTGRES_PASSWORD:-autojob}@db:5432/autojob
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      RUN_VIA_CELERY: "true"
    ports:
      - "9000:9000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A autojob.celery_app.celery worker --loglevel=info
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://autojob:${POSTGRES_PASSWORD:-autojob}@db:5432/autojob
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A autojob.celery_app.celery beat --loglevel=info
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://autojob:${POSTGRES_PASSWORD:-autojob}@db:5432/autojob
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
