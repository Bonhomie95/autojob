<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AutoJob — your CV, applied automatically{% endblock %}</title>
  <meta name="description" content="Upload your CV once. AutoJob finds matching roles, tailors your application, and applies for you — automatically." />
  {% if current_user.is_authenticated %}<meta name="csrf-token" content="{{ csrf_token() }}" />{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230369a1'%3E%3Cpath d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3C/svg%3E" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of wrong theme.
    (function () {
      try {
        var t = localStorage.getItem("autojob-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block nav %}
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="{{ url_for('main.landing') }}" aria-label="AutoJob home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m9 12 2 2 4-4"/></svg>
        AutoJob
      </a>
      <nav class="nav-links" aria-label="Primary">
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light or dark theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        {% if current_user.is_authenticated %}
          <a class="hide-sm" href="{{ url_for('main.dashboard') }}">Dashboard</a>
          <form method="post" action="{{ url_for('auth.logout') }}" style="margin:0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button class="btn btn-ghost" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="hide-sm" href="{{ url_for('auth.login') }}">Sign in</a>
          <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Get started</a>
        {% endif %}
      </nav>
    </div>
  </header>
  {% endblock %}

  {# Server flashes are handed to the toast system as data; a <noscript>
     fallback keeps them visible without JavaScript. #}
  <div class="toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="false">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast-seed" data-type="{{ category }}" hidden>{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <noscript>
        <div class="container"><div class="flashes">
          {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
        </div></div>
      </noscript>
    {% endif %}
  {% endwith %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
  <footer class="footer">
    <div class="container footer-inner">
      <span>&copy; {{ now_year }} AutoJob. Built to get you hired.</span>
      <span class="nav-links">
        <a href="{{ url_for('main.landing') }}#how">How it works</a>
        <a href="{{ url_for('main.landing') }}#features">Features</a>
      </span>
    </div>
  </footer>
  {% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
